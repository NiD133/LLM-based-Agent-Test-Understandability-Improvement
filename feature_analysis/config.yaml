# ═══════════════════════════════════════════════════════════════════════════
# FEATURE / STRUCTURAL ANALYSIS — everything AFTER the main study's Step 5.
#
# Takes the (original, improved) test pairs the main pipeline produced and asks
# WHAT CHANGED, using three tools with non-overlapping scopes:
#
#   RefactoringMiner   semantic refactorings (Variable_rename, Method_name,
#                      Extract Variable, Add Variable Modifier, ~30 kinds)
#   GumTree            comments only (Line Comment / Block Comment / Javadoc)
#   JavaParser         @Test-body segmentation (block-count delta)
#
#   python feature_analysis/feature_analysis.py      # features of every exact-match pair
#   python feature_analysis/plot_heatmaps.py         # the seven paper figures → out/heatmaps/
#   (the stability check lives in stability_check/)
#
# The main study's own config.yaml stops at data/exact_match.json and knows
# nothing about any of this.
# ═══════════════════════════════════════════════════════════════════════════


# ── Input ────────────────────────────────────────────────────────────────
# The tree of (original, improved) pairs, laid out as
#
#     <data_root>/<model>/<project>/<src>/<gran>/…/<test_dir>/
#         <Name>.java            improved test
#         original/<Name>.java   original test (SAME file name)
#
# This is exactly what the main pipeline writes once each model carries an
# `output_dir` in the root config.yaml (agent.models[].output_dir), so no
# renamed export copy is needed any more. The tree is READ-ONLY — every output
# goes under `out` below.
#
# RELATIVE paths resolve against this folder's parent (the project root).
data_root: "agent_improvement/data/improved"

# Extra model trees to fold in that do NOT live under data_root — e.g. a run
# that was produced in a different project. Each entry becomes a <model>
# folder in the analysis, so name the key the way you want it reported.
# Leave empty when everything already sits under data_root.
extra_roots: {}

# ── Output ───────────────────────────────────────────────────────────────
# Created on first run. Nothing else is ever written.
out: "feature_analysis/out/feature_analysis"


# ── Tools ────────────────────────────────────────────────────────────────
# Shared with the main study's tools/ directory — one copy, not two.
gumtree_bin: "tools/gumtree/bin/gumtree"
refactoringminer_bin: "tools/refactoringminer/bin/RefactoringMiner"
javaparser_jar: "tools/javaparser/javaparser-core-3.27.0.jar"

# RefactoringMiner 3.0.12 needs Java 21; GumTree needs 17 — one JDK 21 runs
# both. Empty = JDK_21_HOME from .env at the repository root, else auto-detect
# the newest JDK >= 21 (~/.jdks, /Library/Java/…), else `java` on PATH. A path
# that does not exist is a hard error rather than a silent SKIPPED result.
java_home: ""

# Parallel GumTree + RefactoringMiner workers. Reference: 1086 cases with 16
# workers ≈ 5 minutes per run; RefactoringMiner is the slow step.
jobs: 16
tool_timeout_seconds: 120

# Tests to leave out, matched by SUFFIX against the test path relative to
# data_root, e.g. "commons-io/auto/testcases/FileAlterationObserver_ESTest/test04".
exclude: []

# ── Work list ────────────────────────────────────────────────────────────
# Where the (original, improved) pairs come from. This file is written by
# scripts/summarize_improvements.py and lists ONLY the exact-match
# improvements — the ones whose behaviour did not move, and therefore the only
# ones a feature analysis can say anything about. Comment it out to fall back
# to scanning data_root, which would also pick up the ~925 pairs whose
# behaviour changed.
manifest: "agent_improvement/data/improved/summary/feature_analysis_input.json"
