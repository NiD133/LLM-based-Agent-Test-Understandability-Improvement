# Stability check — settings for run_stability.py
#
#   python3 stability_check/run_stability.py            # run `runs` more runs
#   python3 stability_check/run_stability.py --status   # progress, runs nothing
#   python3 stability_check/analyse_stability_results.py                  # behaviour preservation + Jaccard → results/stability.md

# The frozen sample: 362 test cases drawn by select_sample.py.
data: "stability_check/data/sample_362.json"

# How many runs THIS invocation does. Runs are numbered run1, run2, … under
# output_dir; an unfinished run is completed first and counts as one.
# One run = every case × every model improved again (Step 4), then compiled
# and measured (Step 5: JaCoCo + PIT + exact match).
runs: 1

# Models (ids as in the main config.yaml; their output_dir names the folders)
models:
  claude:
    - "claude-opus-4-8"
    - "claude-sonnet-4-6"
  codex:
    - "gpt-5.5"

# Where the runs go: <output_dir>/run<k>/<model>/<project>/<src>/testcases/<Suite>/<case>/
output_dir: "stability_check/results"
